<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Lab 1 - My First Website</title>
    <style>
      body {
        font-family: Cambria, serif;
      }

      h1 {
        text-align: center;
      }

      h3 {
        text-decoration: underline;
        color: red;
        text-align: center;
      }

      .container {
        display: flex;
        align-items: center;
        gap: 200px;
        justify-content: center;
      }

      label {
        color: green;
        font-size: 16px;
        font-weight: bold;
        display: inline-block;
        width: 120px;
      }

      input {
        color: black;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to my Website</h1>
    <h3>WEB DEVELOPMENT</h3>

    <div class="container">
      <form>
        <div class="form-group">
          <label for="firstName">First name:</label>
          <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" />
        </div>

        <div class="form-group">
          <label for="lastName">Last name:</label>
          <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" />
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" placeholder="Enter your age" />
        </div>

        <div class="form-group">
          <label for="class">Class:</label>
          <input type="text" id="class" name="class" placeholder="Enter your class" />
        </div>

        <div class="form-group">
          <label for="university">University:</label>
          <input type="text" id="university" name="university" placeholder="Enter your university" />
        </div>
      </form>

      <img src="Mewing.jpg" height="250" width="250" alt="Profile image" />
    </div>
  </body>
</html>
